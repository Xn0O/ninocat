<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="googlebot" content="noindex, nofollow" />
    <title>动态 - Nino</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Space+Grotesk:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script>document.documentElement.dataset.theme=sessionStorage.getItem("vb_theme")==="light"?"light":"dark"</script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-page="nnspace" data-theme="dark">
    <main class="shell page-main" style="padding-top:40px">
      <div class="space-top-bar">
        <a class="back-to-blog" href="./blog.html">&larr; 返回博客</a>
      </div>
      <button id="space-theme-btn" class="space-theme-btn" type="button" title="切换主题"></button>
      <section class="space-feed" id="space-feed"></section>
      <section class="space-pagination" id="space-pagination" hidden>
        <button class="btn" id="space-prev" type="button">上一页</button>
        <p class="space-page-info" id="space-page-info">第 1 / 1 页</p>
        <button class="btn" id="space-next" type="button">下一页</button>
      </section>
    </main>

    <footer class="site-footer shell">
      <p data-site="footer-line1">Copyright © 2026 Nino</p>
      <p data-site="footer-line2">All rights reserved.</p>
    </footer>

    <script src="./js/common.js"></script>
    <script src="./js/space.js"></script>
    <div id="page-sweep" class="page-sweep"></div>
  <script src="./js/page-transition.js"></script>
</body>
</html>
