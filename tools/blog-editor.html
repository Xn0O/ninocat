<!doctype html>
<html lang="zh-CN" data-site-config-path="../data/site.json">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="googlebot" content="noindex, nofollow" />
    <title>Editor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Space+Grotesk:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
    <script>document.documentElement.dataset.theme=sessionStorage.getItem("vb_theme")==="light"?"light":"dark"</script>
    <link rel="stylesheet" href="../styles.css" />
    <style>
      :root {
        --surface-2: color-mix(in srgb, var(--surface, #161a22), #0c1220 30%);
        --line: var(--surface-alt, #2e3747);
        --text: var(--text, #eff3ff);
        --muted: var(--muted, #9eadcc);
        --accent: var(--accent, #4ea1ff);
        --accent-ink: var(--accent-ink, #051020);
        --danger: #ff4f68;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--surface, #161a22);
        color: var(--text, #eff3ff);
        font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
      }

      .wrap {
        width: min(1220px, calc(100% - 24px));
        margin: 12px auto 36px;
      }

      .panel {
        border: 1px solid var(--line);
        background: color-mix(in srgb, var(--surface), transparent 8%);
        padding: 14px;
      }

      .editor-top {
        margin-top: 8px;
        padding: 10px 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .editor-top::before {
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.46);
      }

      h1 {
        margin: 0 0 6px;
        font-size: clamp(1.2rem, 3.6vw, 2rem);
      }

      h2 {
        margin: 0 0 8px;
        font-size: 0.98rem;
        color: var(--muted);
      }

      .desc {
        margin: 0;
        color: var(--muted);
        font-size: 0.94rem;
      }

      .flow-list {
        margin: 10px 0 0;
        padding-left: 20px;
        display: grid;
        gap: 6px;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .three-col {
        margin-top: 10px;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
      }

      .group-card {
        border: 1px solid var(--line);
        background: color-mix(in srgb, var(--surface), transparent 10%);
        padding: 10px;
      }

      .grid {
        display: grid;
        gap: 10px;
      }

      .row {
        display: grid;
        grid-template-columns: 150px minmax(0, 1fr) auto;
        gap: 8px;
        align-items: center;
      }

      .row label {
        color: var(--muted);
        font-size: 0.9rem;
      }

      .row input {
        min-width: 0;
      }

      .row.two {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .row.two-col {
        grid-template-columns: 150px minmax(0, 1fr);
      }

      .split-inline {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 16px minmax(0, 1fr);
        gap: 8px;
        align-items: center;
      }

      .split-inline .sep {
        text-align: center;
        color: var(--muted);
      }

      .row.two > div {
        display: grid;
        grid-template-columns: 80px minmax(0, 1fr);
        align-items: center;
        gap: 8px;
      }

      input,
      textarea,
      button {
        font: inherit;
      }

      input:not([type="checkbox"]) {
        width: 100%;
        border: 1px solid color-mix(in srgb, var(--quote-mark), var(--surface-alt) 45%);
        background: var(--surface, #161a22);
        color: var(--text, #eff3ff);
        padding: 8px 10px;
      }

      input:not([type="checkbox"]):focus,
      textarea:focus {
        outline: 1px solid color-mix(in srgb, var(--quote-mark), var(--accent) 35%);
        outline-offset: 1px;
      }

      .check-row {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
      }

      .check-row input {
        width: auto;
      }

      .stack {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .btn {
        border: 0;
        background: var(--accent);
        color: var(--accent-ink);
        font-weight: 700;
        padding: 8px 12px;
        cursor: pointer;
      }

      .btn.ghost {
        background: transparent;
        color: var(--text);
        border: 1px solid var(--line);
      }

      .btn.warn {
        background: var(--danger);
        color: #fff;
      }

      .hint {
        color: var(--muted);
        font-size: 0.84rem;
      }

      .hint.block {
        display: block;
        margin-top: 2px;
      }

      .editor-layout {
        margin-top: 10px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 10px;
      }

      .drop {
        border: 1px dashed color-mix(in srgb, var(--accent), #fff 20%);
        background: color-mix(in srgb, var(--surface, #161a22), var(--surface-alt) 35%);
        padding: 12px;
        color: var(--muted, #9eadcc);
      }

      .drop.active {
        border-style: solid;
        box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent), transparent 65%) inset;
      }

      textarea {
        margin-top: 10px;
        width: 100%;
        min-height: 520px;
        resize: vertical;
        border: 1px solid color-mix(in srgb, var(--quote-mark), var(--surface-alt) 45%);
        background: var(--surface, #161a22);
        color: var(--text, #eff3ff);
        padding: 12px;
        line-height: 1.65;
      }

      .preview-wrap {
        border: 1px solid var(--line);
        background: var(--surface, #161a22);
        min-height: 564px;
        overflow: auto;
      }

      .preview-controls {
        padding: 10px;
        border-bottom: 1px solid var(--line);
        background: var(--surface, #161a22);
      }

      .preview-body {
        padding: 12px;
        line-height: 1.65;
      }

      .preview-body.markdown-content {
        min-height: 540px;
      }

      .log {
        margin-top: 10px;
        border: 1px solid var(--line);
        background: var(--quote-bg);
        padding: 10px;
      }

      #log-list {
        margin: 0;
        padding-left: 20px;
        display: grid;
        gap: 6px;
        font-size: 0.9rem;
      }

      /* Page navigation */
      .page-indicator {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
        margin-bottom: 14px;
      }

      .page-dot {
        height: 4px;
        border-radius: 2px;
        background: var(--line);
        transition: background 0.25s;
      }
      .page-dot.active {
        background: var(--accent);
      }
      .page-dot.done {
        background: color-mix(in srgb, var(--accent), transparent 50%);
      }

      .page-panel {
        display: none;
      }
      .page-panel.active {
        display: block;
      }

      .page-panel .page-head {
        margin-bottom: 14px;
      }
      .page-panel .page-head .page-num {
        font-size: 0.8rem;
        color: var(--muted);
        letter-spacing: 0.04em;
      }
      .page-panel .page-head h1 {
        margin: 2px 0 0;
        font-size: clamp(1.1rem, 3vw, 1.5rem);
      }

      .page-panel .page-body {
        border: 1px solid var(--line);
        background: var(--surface, #161a22);
        padding: 14px;
      }

      .page-panel .page-foot {
        margin-top: 14px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .page-panel .page-foot .btn {
        min-width: 100px;
        padding: 10px 16px;
        font-size: 0.95rem;
      }


      @media (max-width: 1120px) {
        .three-col {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 980px) {
        .editor-layout {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 900px) {
        .row {
          grid-template-columns: 1fr;
          gap: 6px;
        }

        .row.two {
          grid-template-columns: 1fr;
        }

        .row.two > div {
          grid-template-columns: 70px minmax(0, 1fr);
        }
      }
    </style>
  </head>
  <body data-page="blog" data-theme="dark">

    <main class="wrap">
      <div class="page-indicator" id="page-indicator">
        <div class="page-dot active"></div>
        <div class="page-dot"></div>
        <div class="page-dot"></div>
        <div class="page-dot"></div>
      </div>

      <div id="page-container">
        <section class="page-panel active" data-step="1">
          <div class="page-head">
            <p class="page-num">1 / 4</p>
            <h1>文章信息</h1>
          </div>
          <div class="page-body">
            <div class="row">
              <label for="fm-title">标题 title</label>
              <input id="fm-title" type="text" placeholder="第一篇文章" />
              <button id="fm-read" class="btn ghost" type="button">读取</button>
            </div>
            <div class="row two-col" style="margin-top:8px">
              <label for="fm-date">日期 / 标签</label>
              <div class="split-inline">
                <input id="fm-date" type="date" />
                <span class="sep">|</span>
                <input id="fm-tags" type="text" value="Blog" placeholder="tags" />
              </div>
            </div>
            <div class="row two-col" style="margin-top:8px">
              <label for="fm-summary">摘要 summary</label>
              <input id="fm-summary" type="text" placeholder="一句话摘要" />
            </div>
            <div class="row two-col" style="margin-top:8px">
              <label for="fm-cover">封面 cover</label>
              <input id="fm-cover" type="text" value="./assets/Blog/" />
            </div>
            <div class="row two" style="margin-top:8px">
              <div>
                <label for="fm-hidden">隐藏 hidden</label>
                <input id="fm-hidden" type="number" min="0" max="1" step="1" value="0" />
              </div>
              <div>
                <label for="fm-mi-id">MI 编号</label>
                <input id="fm-mi-id" type="text" placeholder="001" />
              </div>
            </div>
            <div class="row two-col" style="margin-top:8px">
              <label for="fm-mi-question">MI 提问</label>
              <input id="fm-mi-question" type="text" placeholder="例如：我们的暗号是什么？" />
            </div>
            <div class="stack" style="margin-top:10px">
              <button id="fm-apply" class="btn" type="button">写入头部</button>
              <button id="fm-new" class="btn ghost" type="button">新建模板</button>
            </div>
          </div>
          <div class="page-foot">
            <span></span>
            <button class="btn" data-next="2">下一步 &rarr;</button>
          </div>
        </section>

        <section class="page-panel" data-step="2">
          <div class="page-head">
            <p class="page-num">2 / 4</p>
            <h1>图片设置</h1>
          </div>
          <div class="page-body">
            <div class="row">
              <label for="post-file-name">文章文件名</label>
              <input id="post-file-name" type="text" placeholder="P1" />
              <button id="create-image-subdir" class="btn" type="button">创建并切换</button>
            </div>
            <div class="row" style="margin-top:8px">
              <label for="img-prefix">图片主目录</label>
              <input id="img-prefix" type="text" value="./assets/Blog" />
              <button id="pick-image-folder" class="btn" type="button">选择目录</button>
            </div>
            <div class="row two-col" style="margin-top:8px">
              <label for="name-rule">截图命名前缀</label>
              <input id="name-rule" type="text" value="post" />
            </div>
            <p class="hint" id="image-folder-state" style="margin-top:8px">未选目录：仅插入 Markdown，不写入图片文件。</p>
            <div class="check-row" style="margin-top:8px">
              <input id="auto-cover" type="checkbox" checked />
              <label for="auto-cover">第一张图自动写入 cover</label>
            </div>
          </div>
          <div class="page-foot">
            <button class="btn ghost" data-prev="1">&larr; 上一步</button>
            <button class="btn" data-next="3">下一步 &rarr;</button>
          </div>
        </section>

        <section class="page-panel" data-step="3">
          <div class="page-head">
            <p class="page-num">3 / 4</p>
            <h1>正文编辑</h1>
          </div>
          <div class="page-body" style="padding:0;border:0;background:transparent">
            <div class="editor-layout">
              <div>
                <div id="drop-zone" class="drop">把图片拖到这里，或在编辑框中直接粘贴截图（Ctrl+V）。</div>
                <textarea id="md-editor" spellcheck="false" placeholder="---&#10;title: 第一篇文章&#10;date: 2026-04-21&#10;summary: 旧的文章等以后有空了再迁移进来！&#10;tags: Blog&#10;cover: ./assets/Blog/P0/P0.jpg&#10;hidden: 0&#10;MI: 问题|001&#10;---&#10;正文内容"></textarea>
              </div>
              <div class="preview-wrap">
                <div class="preview-controls">
                  <div class="stack">
                    <button id="refresh-preview" class="btn ghost" type="button">刷新</button>
                    <button id="fullscreen-preview" class="btn ghost" type="button">全屏</button>
                    <label class="check-row" style="margin:0">
                      <input id="auto-preview" type="checkbox" checked />
                      <span>自动</span>
                    </label>
                    <label class="check-row" style="margin:0">
                      <span>前缀</span>
                      <input id="preview-prefix" type="text" value=".." style="width:70px" />
                    </label>
                  </div>
                </div>
                <article id="md-preview" class="preview-body markdown-content"></article>
              </div>
            </div>
          </div>
          <div class="page-foot">
            <button class="btn ghost" data-prev="2">&larr; 上一步</button>
            <button class="btn" data-next="4">下一步 &rarr;</button>
          </div>
        </section>

        <section class="page-panel" data-step="4">
          <div class="page-head">
            <p class="page-num">4 / 4</p>
            <h1>导出</h1>
          </div>
          <div class="page-body">
            <div class="row">
              <label for="post-folder-state-readonly">文章目录</label>
              <input id="post-folder-state-readonly" type="text" value="请选择 ninocat_private/content/blog" readonly />
              <button id="pick-post-folder" class="btn" type="button">选择目录</button>
            </div>
            <p class="hint" id="post-folder-state" style="margin-top:6px">选择私密仓库目录后再导出。</p>
            <div class="stack" style="margin-top:10px">
              <button id="import-md" class="btn ghost" type="button">导入 MD</button>
              <input id="import-md-file" type="file" accept=".md,.markdown,.mdown,text/markdown,text/plain" hidden />
            </div>
            <div class="stack" style="margin-top:6px">
              <button id="export-md" class="btn" type="button">导出 MD</button>
            </div>
            <div class="stack" style="margin-top:6px">
              <button id="copy-md" class="btn ghost" type="button">复制 MD</button>
              <button id="download-md" class="btn ghost" type="button">下载 MD</button>
              <button id="clear-log" class="btn warn" type="button">清空日志</button>
            </div>
          </div>
          <div class="page-foot">
            <button class="btn ghost" data-prev="3">&larr; 上一步</button>
            <span></span>
          </div>
        </section>
      </div>

      <section class="log">
        <h2>日志</h2>
        <ol id="log-list"></ol>
      </section>
    </main>

    <footer class="site-footer shell">
      <p data-site="footer-line1">Copyright © 2026 Nino</p>
      <p data-site="footer-line2">All rights reserved.</p>
    </footer>

    <script src="../js/common.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script src="./blog-editor.js"></script>
  </body>
</html>
