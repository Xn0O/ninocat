<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="googlebot" content="noindex, nofollow" />
    <title>Nino</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Space+Grotesk:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script>document.documentElement.dataset.theme=sessionStorage.getItem("vb_theme")==="light"?"light":"dark"</script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-page="home" data-theme="dark">
    <header class="top-nav shell">
      <a class="brand" href="./index.html">Nino</a>
      <nav aria-label="主导航">
        <a data-nav="blog" href="./blog.html">博客</a>
        <a data-nav="game" href="./game.html">游戏</a>
        <a data-nav="art" href="./art.html">美术</a>
        <a data-nav="about" href="./about.html">关于</a>
        <a data-nav="lab" href="./lab.html">实验区</a>
      </nav>
      <button id="theme-toggle" class="btn theme-toggle" type="button">切换主题</button>
    </header>

    <main class="shell page-main">
      <section class="home-intro block">
        <p class="eyebrow" data-site="eyebrow">黑白 / 涂鸦 / 实验</p>
        <div class="home-title-line">
          <h1 data-site="title" style="display:none">Nino</h1>
          <img id="home-logo" src="./assets/Home_Site/LOG_white.png" alt="Nino" draggable="false" />
        </div>
        <p data-site="subtitle">加载中...</p>
      </section>

      <section class="home-strip-list" id="home-strip-list" aria-label="首页分区入口"></section>
    </main>

    <footer class="site-footer shell">
      <p data-site="footer-line1">Copyright &copy; 2026 Nino</p>
      <p data-site="footer-line2">All rights reserved.</p>
    </footer>

    <img
      id="home-title-role"
      class="home-title-role"
      src="./assets/Home_Toy/M_0.png"
      alt="主页小人"
      draggable="false"
    />

    <div id="page-sweep" class="page-sweep"></div>
    <canvas id="grid-trail" style="position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none"></canvas>

    <script src="./js/common.js?v=2"></script>
    <script src="./js/home.js"></script>
    <script src="./js/page-transition.js"></script>
    <script>
      // Wrap each home strip for hover border
      function wrapStrips() {
        document.querySelectorAll('.home-strip:not(.wrapped)').forEach(function (s) {
          var w = document.createElement('div');
          w.className = 'strip-wrap';
          s.parentNode.insertBefore(w, s);
          w.appendChild(s);
          s.classList.add('wrapped');
        });
      }
      wrapStrips();
      setInterval(wrapStrips, 500);
      var stripList = document.getElementById('home-strip-list');
      if (stripList) {
        new MutationObserver(wrapStrips).observe(stripList, { childList: true, subtree: true });
      }

      var logo = document.getElementById('home-logo');
      if (logo) {
        function updateLogo() {
          var theme = document.body.getAttribute('data-theme');
          logo.src = './assets/Home_Site/LOG_' + (theme === 'light' ? 'white' : 'black') + '.png';
        }
        updateLogo();
        new MutationObserver(updateLogo).observe(document.body, { attributes: true, attributeFilter: ['data-theme'] });
      }
    </script>
  </body>
</html>
